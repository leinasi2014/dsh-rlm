name: issue-61-fix-red-bytes

on:
  push:
    branches: [codex/issue-61-context-metadata]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-context-metadata
      - name: Correct exact expected UTF-8 byte count
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/rlm-loop.test.ts')
          text = p.read_text(encoding='utf-8')
          old = "assert.equal(restored.result, \"(42, 'context-元数据-hello', 'file', 20)\")"
          new = "assert.equal(restored.result, \"(42, 'context-元数据-hello', 'file', 23)\")"
          if text.count(old) != 1:
              raise SystemExit('expected Issue #61 byte assertion not found exactly once')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/issue-61-fix-red-bytes.yml').unlink()
      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/rlm-loop.test.ts .github/workflows/issue-61-fix-red-bytes.yml
          git commit -m "test(issue-61): charge managed context by UTF-8 bytes"
          git push origin HEAD:codex/issue-61-context-metadata
