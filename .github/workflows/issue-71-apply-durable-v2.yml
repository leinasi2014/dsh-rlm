name: issue-71-apply-durable-v2

on:
  push:
    branches: [codex/issue-71-durable-atomic]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-71-durable-atomic
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Preserve TypeScript newline escapes in the patch generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/issue-71-apply-durable-v2.py')
          text = path.read_text(encoding='utf-8')
          if text.count('durable_block = """') != 1 or text.count('new_test = """') != 1:
              raise SystemExit('durable generator markers changed')
          text = text.replace('durable_block = """', 'durable_block = r"""', 1)
          text = text.replace('new_test = """', 'new_test = r"""', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply guarded durable v2 edits
        run: python scripts/issue-71-apply-durable-v2.py
      - run: git diff --check
      - run: pnpm typecheck
      - name: Run focused durable integrity suite
        run: node --test --test-concurrency=1 tests/rlm-durable-integrity.test.ts
      - name: Run existing M10 regression slice
        run: node --test --test-concurrency=1 --test-name-pattern="M10 Issue#44" tests/rlm-loop.test.ts
      - name: Commit verified durable fix
        shell: bash
        run: |
          rm .github/workflows/issue-71-apply-durable-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(m10): publish private crash-consistent durable envelopes'
          git push origin HEAD:codex/issue-71-durable-atomic
