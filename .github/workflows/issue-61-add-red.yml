name: issue-61-add-red

on:
  push:
    branches: [codex/issue-61-context-metadata]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-context-metadata
          fetch-depth: 0
      - name: Insert guarded M5/M9 round-trip RED test
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/rlm-loop.test.ts')
          text = p.read_text(encoding='utf-8')
          marker = "test('M10 Issue#44: reset deletes the durable reference for that Session only', async () => {"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('M10 insertion marker not found')
          if 'Issue#61: chunked recovery restores managed context metadata emitted by the same kernel' in text:
              raise SystemExit('Issue #61 RED already present')
          block = r'''test('Issue#61: chunked recovery restores managed context metadata emitted by the same kernel', async () => {
            const { createRlmRuntime, RlmError } = await import('../src/runtime.ts')
            const workspace = mkdtempSync(path.join(os.tmpdir(), 'dsh-rlm-m5-context-meta-'))
            const source = path.join(workspace, 'context.txt')
            writeFileSync(source, 'context-元数据-hello', 'utf8')
            const ctx: any = {
              get(name: string) {
                if (name === 'sandbox') {
                  return {
                    confine(argv: string[]) {
                      return { argv: [...argv], enforcement: 'full', denialSignatures: [], runnerFailureRules: [] }
                    },
                  }
                }
                if (name === 'sandboxPolicy') {
                  return { resolve() { return { mode: 'workspace-write', workspaceRoot: workspace } } }
                }
                return undefined
              },
            }
            const runtime = createRlmRuntime(ctx, { snapshotRecovery: true, timeout: 8_000 })
            try {
              const saved = await runtime.eval('issue61-context', {
                session: { id: 'issue61-context' },
                contextPath: source,
                code: 'keep = 41',
              })
              assert.equal(saved.recovery?.checkpointCommitted, true)
              await assert.rejects(
                runtime.eval('issue61-context', { session: { id: 'issue61-context' }, code: 'import os\nos._exit(13)' }),
                (error: unknown) => error instanceof RlmError && error.kind === 'closed',
              )
              const restored = await runtime.eval('issue61-context', {
                session: { id: 'issue61-context' },
                code: '(keep + 1, context, context_meta["kind"], context_meta["bytes"])',
              })
              assert.equal(restored.result, "(42, 'context-元数据-hello', 'file', 20)")
              assert.equal(restored.recovery?.restored, true)
            } finally {
              await runtime.dispose()
              rmSync(workspace, { recursive: true, force: true })
            }
          })

          '''
          p.write_text(text[:pos] + block + text[pos:], encoding='utf-8')
          Path('.github/workflows/issue-61-add-red.yml').unlink()
      - name: Commit RED and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/rlm-loop.test.ts .github/workflows/issue-61-add-red.yml
          git commit -m "test(issue-61): reproduce chunked context metadata restore failure"
          git push origin HEAD:codex/issue-61-context-metadata
