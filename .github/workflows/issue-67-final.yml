name: issue-67-final
on:
  push:
    branches: [codex/issue-67-snapshot-io-v3]
permissions:
  contents: write
jobs:
  replay:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-67-snapshot-io-v3
          fetch-depth: 0
      - run: git fetch origin codex/issue-67-snapshot-io-v2
      - run: python scripts/issue67-final.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf(issue-67): make snapshot publication async and deduplicated"
          git push origin HEAD:codex/issue-67-snapshot-io-v3
