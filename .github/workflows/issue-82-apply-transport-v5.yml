name: issue-82-apply-transport-v5

on:
  push:
    branches: [codex/issue-82-checkpoint-transport]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-82-checkpoint-transport
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Apply guarded Host and kernel transport edits
        run: python scripts/issue-82-apply-transport-v5.py
      - run: git diff --check
      - run: python -m py_compile python-runtime/rlm_kernel.py
      - name: Typecheck patched Host
        run: pnpm typecheck
      - name: Run focused checkpoint transport GREEN suite
        run: node --test --test-concurrency=1 tests/rlm-checkpoint-transport.test.ts
      - name: Commit verified transport patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(protocol): use byte-safe validated checkpoint transport v5'
          git push origin HEAD:codex/issue-82-checkpoint-transport
