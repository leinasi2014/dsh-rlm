name: issue-75-replay-ui

on:
  push:
    branches: [codex/issue-75-settings-ux-v2]

permissions:
  contents: write

jobs:
  replay:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-75-settings-ux-v2
          fetch-depth: 0
      - name: Replay visual/copy changes and keep current atomic save semantics
        shell: bash
        run: |
          git fetch origin codex/issue-75-settings-ux
          git show origin/codex/issue-75-settings-ux:src/client/RlmSettingsCard.tsx > src/client/RlmSettingsCard.tsx
          git show origin/codex/issue-75-settings-ux:src/client/rlm-settings-locales.ts > src/client/rlm-settings-locales.ts
          python - <<'PY'
          from pathlib import Path
          import re

          card = Path('src/client/RlmSettingsCard.tsx')
          text = card.read_text(encoding='utf-8')
          text = text.replace("import type { SettingsScope } from '@deepseek-ai/dsh-client-runtime/client'", "import type { SettingsScope } from '@deepseek-ai/dsh-client-ui-settings/client'")
          text = text.replace("  buildWrites,\n  resetState,", "  buildWrites,\n  buildMutation,\n  resetState,")
          text = text.replace("  type RlmFieldWrite,\n", "")
          text = re.sub(r"\ntype SettingsMutationOp =\n  \| \{ op: 'set'; path: string\[\]; value: boolean \| number \| string \}\n  \| \{ op: 'unset'; path: string\[\] \}\n", "\n", text, count=1)

          old = '''    const expectedRevision = snapshot.revision
              const planned = [...writes]
              const ops = mutationOps(planned)
              void (async () => {
                dispatch({ type: 'begin' })
                try {
                  const compatible = props.scope as SettingsScope<RlmSettings> & {
                    mutate?: (ops: readonly SettingsMutationOp[], expectedRevision?: number) => Promise<void>
                  }
                  if (typeof compatible.mutate === 'function') {
                    await compatible.mutate(ops, expectedRevision)
                  } else {
                    // dsh-client-runtime 0.1.1-rc.2 has only field writes. Keep that
                    // supported baseline usable; #69/#77 track moving the minimum DSH
                    // version to the atomic namespace mutation contract.
                    for (const write of planned) {
                      if (write.op === 'clear') await props.scope.unset(write.key)
                      else await props.scope.set(write.key, write.value)
                    }
                  }
                  const accepted = props.scope.getSnapshot()
                  if (!writesLanded(accepted.user, planned)) {
                    dispatch({ type: 'fail' })
                    return
                  }
                  setDirty(new Set())
                  setStagedClear(new Set())
                  dispatch({ type: 'succeed' })
                } catch {
                  dispatch({ type: 'fail' })
                }
              })()'''.replace('              ', '')
          new = '''    const expectedRevision = snapshot.revision
              const planned = [...writes]
              void (async () => {
                dispatch({ type: 'begin' })
                try {
                  // Issue #69 is now the supported contract: one atomic,
                  // revision-fenced namespace mutation. Never regress to
                  // sequential field writes from this UI.
                  await props.scope.mutate(buildMutation(planned), expectedRevision)
                  setDirty(new Set())
                  setStagedClear(new Set())
                  dispatch({ type: 'succeed' })
                } catch {
                  // Preserve the staged draft so the user can inspect/retry.
                  dispatch({ type: 'fail' })
                }
              })()'''.replace('              ', '')
          if old not in text:
              raise SystemExit('old Issue #75 save block changed; refusing replay')
          text = text.replace(old, new, 1)

          start = text.find('\nfunction mutationOps(')
          end = text.find('\nfunction firstProblemKey(', start)
          if start < 0 or end < 0:
              raise SystemExit('old compatibility helpers not found')
          text = text[:start] + text[end:]
          card.write_text(text, encoding='utf-8')

          test = Path('tests/rlm-settings-ux.test.ts')
          test.write_text(r'''import test from 'node:test'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { RLM_FIELDS } from '../src/client/rlm-settings-model.ts'
          import { FIELD_HINT, TAB_HELP, rlmSettingsEn, rlmSettingsZh } from '../src/client/rlm-settings-locales.ts'

          const cardSource = readFileSync(new URL('../src/client/RlmSettingsCard.tsx', import.meta.url), 'utf8')

          test('M13 UX #75: every user-facing field and section has detailed bilingual help', () => {
            for (const field of RLM_FIELDS) {
              const key = FIELD_HINT[field.key]
              assert.equal(typeof key, 'string', `missing hint key for ${field.key}`)
              assert.ok(rlmSettingsEn[key].length >= 40, `English help is too short for ${field.key}`)
              assert.ok(rlmSettingsZh[key].length >= 20, `Chinese help is too short for ${field.key}`)
            }
            for (const key of Object.values(TAB_HELP)) {
              assert.ok(rlmSettingsEn[key].length >= 40)
              assert.ok(rlmSettingsZh[key].length >= 20)
            }
          })

          test('M13 UX #75/#69: Save is one atomic revision-fenced mutation with no sequential fallback', () => {
            assert.match(cardSource, /props\.scope\.mutate\(buildMutation\(planned\), expectedRevision\)/)
            assert.doesNotMatch(cardSource, /props\.scope\.set\(/)
            assert.doesNotMatch(cardSource, /props\.scope\.unset\(/)
            assert.doesNotMatch(cardSource, /compatible\.mutate/)
          })

          test('M13 UX #75/#80: existing overrides can reset before another edit', () => {
            assert.match(cardSource, /dirty\.size > 0 \|\| overrides\.size > 0/)
            assert.match(cardSource, /resetState\(snapshot\.base/)
          })

          test('M13 UX #75: disabled plugin can still be preconfigured; only true dependencies disable fields', () => {
            assert.doesNotMatch(cardSource, /!props\.draft\.enabled/)
            assert.match(cardSource, /field === 'durableRoot' && !draft\.snapshotRecovery/)
            assert.match(cardSource, /field === 'maxQueryTokensPerCell' && !draft\.guardQueryTokens/)
          })

          test('M13 UX #75: card uses DSH aliases and no bespoke gradient mini-app styling', () => {
            assert.match(cardSource, /--dsw-alias-/)
            assert.doesNotMatch(cardSource, /linear-gradient/)
            assert.match(cardSource, /role="tablist"/)
            assert.match(cardSource, /role="tabpanel"/)
            assert.match(cardSource, /aria-controls=/)
          })
          '''.replace('          ', ''), encoding='utf-8')

          package = Path('package.json')
          pkg = package.read_text(encoding='utf-8')
          anchor = 'tests/rlm-settings-manifest.test.ts tests/rlm-python-resolution.test.ts'
          replacement = 'tests/rlm-settings-manifest.test.ts tests/rlm-settings-ux.test.ts tests/rlm-python-resolution.test.ts'
          if replacement not in pkg:
              if pkg.count(anchor) != 1:
                  raise SystemExit('package test command anchor changed')
              pkg = pkg.replace(anchor, replacement, 1)
          package.write_text(pkg, encoding='utf-8')

          memory = Path('docs/development-memory/records/2026/issue-75.jsonl')
          memory.parent.mkdir(parents=True, exist_ok=True)
          memory.write_text('''{"schemaVersion":1,"recordId":"mem-20260906-issue75-clean-ui-replay","recordedAt":"2026-09-06T22:06:00+08:00","agent":{"name":"chatgpt-ui-implementer","id":"chatgpt-ui-implementer","model":"GPT-5.6 Sol","role":"implementer","reasoning":"high"},"issue":75,"workItem":"issue-0075","baseCommit":"58119a125f26c87b2493f604e9d0a46f4fbc6960","candidateRef":"same-commit","summary":"Replay the previously tested simple-first settings UI on the current shared manifest stack while preserving the merged Issue #69 atomic mutation contract and removing the obsolete sequential-write compatibility fallback.","files":[{"path":"src/client/RlmSettingsCard.tsx","pointers":["simple-first tabs","DSH alias tokens","dependencyOf","atomic save","discard/reset footer"]},{"path":"src/client/rlm-settings-locales.ts","pointers":["detailed en/zh field help","TAB_HELP"]},{"path":"tests/rlm-settings-ux.test.ts","pointers":["bilingual help","atomic save","preconfiguration","DSH styling/accessibility"]},{"path":"package.json","pointers":["scripts.test UX regression"]}],"steps":["Copied only the previously reviewed UI/card copy from the stale Issue #75 branch onto the current Issue #73 manifest stack.","Replaced its old optional mutate/sequential set-unset compatibility path with the current Issue #69 contract: buildMutation plus one revision-fenced SettingsScope.mutate call.","Kept simple-first General/Limits/Recovery & safety/Token guard navigation, DSH alias tokens, readable units, detailed bilingual help, Save/Discard/Reset and true dependency disabling only.","Added source-level regression guards that forbid sequential setting writes and bespoke gradient styling."],"evidence":[{"kind":"test","target":"old Issue #75 candidate CI 34006899788","result":"PASS","note":"The earlier visual/copy candidate typechecked, built and passed its full baseline tests before later main changes."},{"kind":"test","target":"current stacked Windows+Ubuntu CI","result":"NOT_RUN","note":"Final replay acceptance is pending after this commit."}],"limitations":["No browser/computer renderer is available in this execution environment, so manual light/dark and narrow/desktop visual click-through remains unclaimed; static DSH-token/responsive/accessibility checks are automated."]}
''', encoding='utf-8')

          Path('.github/workflows/issue-75-replay-ui.yml').unlink()
          PY
      - name: Commit clean UI replay and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/client/RlmSettingsCard.tsx src/client/rlm-settings-locales.ts tests/rlm-settings-ux.test.ts package.json docs/development-memory/records/2026/issue-75.jsonl .github/workflows/issue-75-replay-ui.yml
          git commit -m "feat(issue-75): simplify and unify RLM settings UI"
          git push origin HEAD:codex/issue-75-settings-ux-v2
