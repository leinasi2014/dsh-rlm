name: issue-67-apply
on:
  push:
    branches: [codex/issue-67-snapshot-io]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-67-snapshot-io
      - run: python scripts/issue67-apply.py
      - name: Commit async snapshot candidate and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf(issue-67): make snapshot publication async and deduplicated"
          git push origin HEAD:codex/issue-67-snapshot-io
