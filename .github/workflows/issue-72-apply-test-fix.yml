name: issue-72-apply-test-fix

on:
  push:
    branches: [codex/issue-72-posix-ci]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-72-posix-ci
          fetch-depth: 0
      - name: Patch the M3 path-race test without rewriting the 194KB file through the API
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/rlm-loop.test.ts')
          text = p.read_text(encoding='utf-8')
          old = '''    'path, replacement = sys.argv[2], sys.argv[3]',
              'original_lstat = os.lstat',
              'calls = 0',
              'def replaced_lstat(target):',
              '    global calls',
              '    calls += 1',
              '    if calls == 2: return original_lstat(replacement)',
              '    return original_lstat(target)',
              'os.lstat = replaced_lstat',
          '''
          new = '''    'path, replacement = sys.argv[2], sys.argv[3]',
              'canonical = os.path.realpath(path)',
              'original_realpath = os.path.realpath',
              'original_lstat = os.lstat',
              'calls = 0',
              'def replaced_lstat(target):',
              '    global calls',
              '    calls += 1',
              '    if calls == 2: return original_lstat(replacement)',
              '    return original_lstat(target)',
              'os.lstat = replaced_lstat',
              'os.path.realpath = lambda target: canonical if target == path else original_realpath(target)',
          '''
          if old not in text:
              raise SystemExit('expected M3 path-race test block not found; refusing broad edit')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/issue-72-apply-test-fix.yml').unlink()
      - name: Commit exact patch and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/rlm-loop.test.ts .github/workflows/issue-72-apply-test-fix.yml
          git commit -m "test(issue-72): make M3 path-race injection POSIX deterministic"
          git push origin HEAD:codex/issue-72-posix-ci
