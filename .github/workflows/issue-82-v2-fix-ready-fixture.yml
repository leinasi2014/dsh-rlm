name: issue-82-v2-fix-ready-fixture

on:
  push:
    branches: [codex/issue-82-checkpoint-transport-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-82-checkpoint-transport-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Replace the single stale pressed-kernel ready version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/rlm-loop.test.ts')
          text = path.read_text(encoding='utf-8')
          old = 'sys.stdout.write(json.dumps({"type": "ready", "version": 4}) + "\\\\n")'
          new = 'sys.stdout.write(json.dumps({"type": "ready", "version": 5}) + "\\\\n")'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale ready-v4 fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/issue-82-v2-fix-ready-fixture.yml').unlink()
          PY
          git diff --check
      - name: Run the corrected shared-deadline fixture
        run: node --test --test-name-pattern="startup and cell share one total deadline" tests/rlm-loop.test.ts
      - name: Commit verified fixture correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(protocol): align pressed ready fixture with v5'
          git push origin HEAD:codex/issue-82-checkpoint-transport-v2
